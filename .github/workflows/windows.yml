name: Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.go'
      - 'go.*'
      - 'web/**'
      - 'licenses/**'
      - 'install.ps1'
      - 'scripts/build-windows.ps1'
      - 'contrib/run-windows.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '*.go'
      - 'go.*'
      - 'web/**'
      - 'licenses/**'
      - 'install.ps1'
      - 'scripts/build-windows.ps1'
      - 'contrib/run-windows.ps1'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            arch: arm64
          - runner: windows-2022
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test Native Windows Contracts
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and Inspect Release Artifacts
        run: ./scripts/build-windows.ps1 -Architecture ${{ matrix.arch }}
      - name: Verify Installer on Windows PowerShell 5.1 (iex)
        shell: powershell
        run: |
          $env:FASTCONTROL_PACKAGE_DIR = (Resolve-Path dist).Path
          $env:FASTCONTROL_SKIP_SPEECH = '1'
          $grokStub = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.grok\sessions\ci\s1'
          New-Item -ItemType Directory -Path $grokStub -Force | Out-Null
          try {
            (Get-Content ./install.ps1 -Raw) | Invoke-Expression
            $dir = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.fastcontrol'
            $relay = Join-Path $dir 'fastcontrol.exe'
            if (-not (Test-Path $relay)) { throw 'Installed Relay Missing After Windows PowerShell 5.1 Run' }
            $ready = $false
            $fallbackProc = $null
            for ($i = 0; $i -lt 16; $i++) {
              Start-Sleep -Milliseconds 500
              $tokenPath = Join-Path $dir 'token'
              if (Test-Path $tokenPath) {
                $tok = (Get-Content $tokenPath -Raw).Trim()
                try {
                  $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8787/auth?t=$tok" -UseBasicParsing -TimeoutSec 2
                  if ($resp.StatusCode -eq 204) { $ready = $true; break }
                } catch {}
              }
            }
            if (-not $ready) {
              $info = Get-ScheduledTaskInfo -TaskName fastcontrol -ErrorAction SilentlyContinue
              Write-Host "Scheduled task info on headless runner: state=$((Get-ScheduledTask -TaskName fastcontrol).State) lastResult=$($info.LastTaskResult)"
              if (-not [Environment]::UserInteractive) {
                # Headless Windows runners (such as windows-11-arm) have no interactive desktop session
                # for LogonType Interactive tasks; execute run-windows.ps1 directly under PowerShell 5.1.
                $fallbackProc = Start-Process -FilePath 'powershell.exe' -ArgumentList @('-NoProfile', '-NonInteractive', '-WindowStyle', 'Hidden', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $dir 'run-windows.ps1')) -WorkingDirectory $dir -PassThru
                for ($i = 0; $i -lt 20; $i++) {
                  Start-Sleep -Milliseconds 500
                  $tokenPath = Join-Path $dir 'token'
                  if (Test-Path $tokenPath) {
                    $tok = (Get-Content $tokenPath -Raw).Trim()
                    try {
                      $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8787/auth?t=$tok" -UseBasicParsing -TimeoutSec 2
                      if ($resp.StatusCode -eq 204) { $ready = $true; break }
                    } catch {}
                  }
                }
              }
            }
            if (-not $ready) {
              if (Test-Path (Join-Path $dir 'relay.log')) { Get-Content (Join-Path $dir 'relay.log') -Tail 40 }
              throw 'Background Relay Did Not Become Ready On Windows PowerShell 5.1'
            }
            Start-Sleep -Seconds 2
            $tok = (Get-Content (Join-Path $dir 'token') -Raw).Trim()
            $alive = Invoke-WebRequest -Uri "http://127.0.0.1:8787/auth?t=$tok" -UseBasicParsing -TimeoutSec 2
            if ($alive.StatusCode -ne 204) { throw "Expected Relay Still Alive (204), Got $($alive.StatusCode)" }
            if ($null -eq $fallbackProc) {
              $task = Get-ScheduledTask -TaskName fastcontrol
              if ($task.State -ne 'Running') { throw "Expected Scheduled Task Running, Got $($task.State)" }
            } elseif ($fallbackProc.HasExited) {
              throw "run-windows.ps1 Exited Prematurely With Code $($fallbackProc.ExitCode)"
            }
          } finally {
            if ($null -ne $fallbackProc -and -not $fallbackProc.HasExited) { Stop-Process -Id $fallbackProc.Id -Force -ErrorAction SilentlyContinue }
            Stop-ScheduledTask -TaskName fastcontrol -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName fastcontrol -Confirm:$false -ErrorAction SilentlyContinue
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'fastcontrol.exe' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Remove-Item (Join-Path ([Environment]::GetFolderPath('UserProfile')) '.grok') -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Verify Installer and Local Speech Setup
        run: |
          ./install.ps1 -PackageDirectory dist -SkipSpeech
          $relay = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.fastcontrol/fastcontrol.exe'
          & $relay -install-speech
          if ($LASTEXITCODE -ne 0) { throw 'Installed Speech Setup Failed' }
          $status = (& $relay -speech-status | ConvertFrom-Json)
          if (-not $status.available -or $status.engine -ne 'whispercpp') { throw 'Installed Speech Model Is Unavailable' }
          Stop-ScheduledTask -TaskName fastcontrol
          Unregister-ScheduledTask -TaskName fastcontrol -Confirm:$false
      - uses: actions/upload-artifact@v4
        with:
          name: fastcontrol-windows-${{ matrix.arch }}
          path: |
            dist/fastcontrol_windows_${{ matrix.arch }}.zip
            dist/SHA256SUMS_windows_${{ matrix.arch }}
          if-no-files-found: error
