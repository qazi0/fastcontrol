name: Windows ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.go'
      - 'go.*'
      - 'web/**'
      - 'install.ps1'
      - 'scripts/build-windows.ps1'
      - 'contrib/run-windows.ps1'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test Native Windows Contracts
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and Inspect Release Artifacts
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: fastcontrol-windows-arm64
          path: |
            dist/fastcontrol_windows_arm64.zip
            dist/SHA256SUMS_windows_arm64
          if-no-files-found: error
