name: Windows ARM64
on:
  workflow_dispatch:
  push:
    branches: [main]
    branches: [main]
    paths:
      - '*.go'
      - 'go.*'
      - 'web/**'
      - 'licenses/**'
      - 'install.ps1'
      - 'scripts/build-windows.ps1'
      - 'contrib/run-windows.ps1'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - '*.go'
      - 'go.*'
      - 'web/**'
      - 'licenses/**'
      - 'install.ps1'
      - 'scripts/build-windows.ps1'
      - 'contrib/run-windows.ps1'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test Native Windows Contracts
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and Inspect Release Artifacts
        run: ./scripts/build-windows.ps1
      - name: Verify Installer and Local Speech Setup
        run: |
          ./install.ps1 -PackageDirectory dist -SkipSpeech
          $relay = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.fastcontrol/fastcontrol.exe'
          & $relay -install-speech
          if ($LASTEXITCODE -ne 0) { throw 'Installed Speech Setup Failed' }
          $status = (& $relay -speech-status | ConvertFrom-Json)
          if (-not $status.available -or $status.engine -ne 'whispercpp') { throw 'Installed Speech Model Is Unavailable' }
          Stop-ScheduledTask -TaskName fastcontrol
          Unregister-ScheduledTask -TaskName fastcontrol -Confirm:$false
      - uses: actions/upload-artifact@v4
        with:
          name: fastcontrol-windows-arm64
          path: |
            dist/fastcontrol_windows_arm64.zip
            dist/SHA256SUMS_windows_arm64
          if-no-files-found: error
