name: Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.go', 'go.*', 'web/**', 'install.sh', 'scripts/package-linux.sh', 'scripts/test-linux.sh', 'contrib/fastcontrol.service', '.github/workflows/linux.yml']
  pull_request:
    paths: ['*.go', 'go.*', 'web/**', 'install.sh', 'scripts/package-linux.sh', 'scripts/test-linux.sh', 'contrib/fastcontrol.service', '.github/workflows/linux.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 25
    steps:
      - name: Install Build Tools
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates curl build-essential cmake file ripgrep ffmpeg python3 systemd
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test Linux Contracts
        run: make test && go test -race ./...
      - name: Build Linux Release
        run: scripts/package-linux.sh
      - name: Verify Installed Package
        run: scripts/test-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fastcontrol-linux-${{ matrix.arch }}
          path: |
            dist/fastcontrol_linux_${{ matrix.arch }}.tar.gz
            dist/SHA256SUMS_linux_${{ matrix.arch }}
          if-no-files-found: error
