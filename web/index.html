<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>fastcontrol</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="providers" class="view hidden">
    <header class="bar"><h1 class="brand">fastcontrol</h1><span class="grow"></span><button id="provider-macs" class="icon-btn" aria-label="Macs And Notifications"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button></header>
    <main class="scroll provider-choice"><button class="provider-option" data-provider="codex"><span>Codex</span><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button><button class="provider-option" data-provider="claude"><span>Claude Code</span><svg class="ico" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></main>
  </section>

  <!-- Home: Macs, projects, pinned and recent threads -->
  <section id="home" class="view">
    <header class="bar">
      <h1 class="brand">fastcontrol</h1>
      <button id="provider-switch" class="chip" aria-label="Change Agent">Codex</button>
      <span class="grow"></span>
      <button id="search-btn" class="icon-btn" aria-label="Search Threads"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button id="macs-btn" class="icon-btn" aria-label="Macs And Notifications"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    </header>
    <div id="search-row" class="search-row hidden"><input id="search" type="search" placeholder="Search All Threads" autocomplete="off" enterkeyhint="search"></div>
    <nav id="machines" class="chips"></nav>
    <main id="home-list" class="scroll list"></main>
    <div class="dock">
      <button id="ask" class="ask"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Ask Codex</span></button>
    </div>
  </section>

  <!-- One project: its threads -->
  <section id="project" class="view hidden">
    <header class="bar">
      <button class="icon-btn back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="head-text">
        <div id="p-title" class="h-title">Project</div>
        <div id="p-sub" class="h-sub"></div>
      </div>
    </header>
    <main id="project-list" class="scroll list"></main>
    <div class="dock row-dock">
      <label class="search-pill"><svg class="ico sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="p-search" type="search" placeholder="Search Chats" autocomplete="off"></label>
      <button id="p-new" class="btn primary pill-btn"><svg class="ico sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Chat</button>
    </div>
  </section>

  <!-- One thread -->
  <section id="thread" class="view hidden">
    <header class="bar thread-bar">
      <button class="icon-btn back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="head-text">
        <div id="t-title" class="h-title">Thread</div>
        <div id="t-sub" class="h-sub"></div>
      </div>
      <div id="t-status" class="status hidden"></div>
      <button id="t-ring" class="ring" aria-label="Context Usage"></button>
      <button id="menu-btn" class="icon-btn" aria-label="Thread Actions"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </header>
    <div id="banner" class="banner hidden"></div>
    <main id="feed" class="scroll feed"></main>
    <div id="jump" class="jump hidden"><button id="jump-btn" class="chip">Jump To Latest</button></div>
    <div id="dockcards" class="dockcards"></div>
    <div id="activity" class="activity hidden" role="status" aria-live="polite"><span class="thinking">Thinking</span></div>
    <form id="composer" class="composer">
      <div id="voice-panel" class="voice-panel hidden">
        <div class="voice-top"><span class="voice-status"><span id="voice-label" aria-live="polite">Listening</span><span id="voice-spinner" class="voice-spinner hidden" aria-hidden="true"></span></span><span id="voice-time" class="mono voice-time">0:00</span></div>
        <div id="voice-wave" class="voice-wave" aria-hidden="true"></div>
        <div class="voice-actions"><button id="voice-cancel" type="button" class="icon-btn" aria-label="Cancel Recording"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      </div>
      <div id="attachments" class="attachments"></div>
      <textarea id="input" rows="1" placeholder="Message Codex" enterkeyhint="send"></textarea>
      <div class="tools">
        <button id="attach" type="button" class="icon-btn" aria-label="Attach Image"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="perm-chip" type="button" class="tool-chip icon" aria-label="Permissions"></button>
        <button id="model-chip" type="button" class="tool-chip model-chip" aria-label="Model"></button>
        <button id="effort-btn" type="button" class="tool-chip icon gauge" aria-label="Intelligence"></button>
        <button id="voice" type="button" class="icon-btn hidden" aria-label="Record Voice"><svg class="ico" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0014 0v-2M12 19v3M8 22h8"/></svg></button>
        <button id="stop" type="button" class="round stop hidden" aria-label="Stop"><svg class="ico fill" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4"/></svg></button>
        <button id="send" type="submit" class="round send" aria-label="Send"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
    </form>
  </section>
</div>

<div id="scrim" class="scrim hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<div id="toast" class="toast hidden" role="status"></div>
<script src="app.js"></script>
</body>
</html>
